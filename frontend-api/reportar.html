<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente - Help Desk</title>
    <!-- Asegúrate que la ruta al CSS sea correcta -->
    
</head><link rel="stylesheet" href="css/styles.css">
<body>
    <header>
        <h1>Formulario de Reporte de Incidentes</h1>
        <nav>
            <a href="inicio.html">Inicio</a> |
            <a href="reportar.html">Reportar</a> |
            <a href="tickets.html">Ver Tickets</a>
        </nav>
    </header>

    <main>
        <form id="formTicket">
            <div class="campo">
                <label for="titulo">Título del Incidente:</label>
                <input type="text" id="titulo" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoría:</label>
                <select id="categoria" required>
                    <option value="">Seleccione...</option>
                    <option value="Red">Red</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                </select>
            </div>

            <div class="campo">
                <label>Prioridad:</label>
                <div class="opciones">
                    <label><input type="radio" name="prioridad" value="Alta" required> Alta</label>
                    <label><input type="radio" name="prioridad" value="Media"> Media</label>
                    <label><input type="radio" name="prioridad" value="Baja"> Baja</label>
                </div>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción Detallada:</label>
                <textarea id="descripcion" rows="5" required></textarea>
            </div>

            <button type="submit">Enviar Reporte</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Help Desk System - Luis Congo</p>
    </footer>

    <script>
        // Código que envía los datos a tu base de datos
        document.getElementById('formTicket').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                titulo: document.getElementById('titulo').value,
                categoria: document.getElementById('categoria').value,
                prioridad: document.querySelector('input[name="prioridad"]:checked').value,
                descripcion: document.getElementById('descripcion').value
            };

            try {
                const respuesta = await fetch('http://localhost:3000/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if(respuesta.ok){
                    alert('✅ ¡Ticket guardado correctamente!');
                    e.target.reset();
                }else{
                    alert('❌ Error: ' + resultado.mensaje);
                }
            } catch (error) {
                alert('❌ No se pudo conectar. Revisa que el servidor esté activo.');
            }
        });
    </script>
</body>
</html>
