<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Tickets - Help Desk</title>
   <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Listado de Incidentes</h1>
        <nav>
            <a href="inicio.html">Inicio</a> |
            <a href="reportar.html">Reportar</a> |
            <a href="tickets.html">Ver Tickets</a>
        </nav>
    </header>

    <main>
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Categoría</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="listaTickets"></tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 Help Desk System - Luis Congo</p>
    </footer>

    <script>
        // Carga los tickets desde la base de datos
        async function cargarTickets() {
            const lista = document.getElementById('listaTickets');
            try {
                const res = await fetch('http://localhost:3000/tickets');
                const tickets = await res.json();

                lista.innerHTML = '';
                tickets.forEach(t => {
                    lista.innerHTML += `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.titulo}</td>
                        <td>${t.categoria}</td>
                        <td>${t.prioridad}</td>
                        <td>${t.estado}</td>
                    </tr>`;
                });
            } catch (error) {
                lista.innerHTML = `<tr><td colspan="5">Error al cargar datos</td></tr>`;
            }
        }

        cargarTickets();
    </script>
</body>
</html>
